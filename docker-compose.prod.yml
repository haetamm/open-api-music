services:
  app:
    image: thaetamii/musweb-api
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: musweb-api-prod
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    ports:
      - "5000:5000"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s